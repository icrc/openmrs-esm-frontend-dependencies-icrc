name: Publish

# Manual only while the npm publishing setup is being stabilized. The "release"
# input selects which path runs, and "bump" decides what main is lined up for
# once a release is out:
#   release unchecked -> pre-release on the "pre" dist-tag
#   release checked   -> publishes latest, tags the commit, opens the bump PR
# Restore the push trigger below once publishing is validated.
#
# No --provenance. This repository is private, and npm only attests packages
# published from a public source repository, failing at the registry with a 422
# and publishing nothing. If it is ever made public, add --provenance back to
# both publish steps.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release (tag + latest). Leave unchecked for a pre-release."
        type: boolean
        default: false
      bump:
        description: "Version to prepare on main after the release. Ignored for a pre-release."
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: minor
  # push:
  #   branches: [main]

permissions:
  id-token: write # Required for npm trusted publishers (OIDC)
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # --legacy-peer-deps is required: the pinned @openmrs and react versions
      # in this bundle do not satisfy each other's peer ranges.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Version must be set before building: the version is stamped into the
      # generated import map.
      - name: Set pre-release version
        if: ${{ !inputs.release }}
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-pre.${{ github.run_number }}"

      - name: Build
        run: npm run build

      - name: Publish pre-release
        if: ${{ !inputs.release }}
        run: npm publish --access public --tag pre

      - name: Publish release
        if: ${{ inputs.release }}
        run: npm publish --access public

      - name: Git Config
        if: ${{ inputs.release }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

      - name: Git tag
        if: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_PROJECT_VERSION=$(node -p "require('./package.json').version")
          git tag "$CURRENT_PROJECT_VERSION"
          git push origin "$CURRENT_PROJECT_VERSION"
          gh release create "$CURRENT_PROJECT_VERSION"

      # npm bumps natively, so no semver dependency is needed here.
      - name: Move to next Version
        if: ${{ inputs.release && inputs.bump != 'none' }}
        run: npm version --no-git-tag-version ${{ inputs.bump }}

      # This step creates a PR to bump the version to the next snapshot.
      # The PR must be accepted and merged to prepare main for the next release cycle.
      - name: Create Branch and PR for next Version preparation
        if: ${{ inputs.release && inputs.bump != 'none' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_PROJECT_VERSION=$(node -p "require('./package.json').version")
          BRANCH_NAME="move-to-$CURRENT_PROJECT_VERSION"
          git push origin --delete "$BRANCH_NAME" 2>/dev/null || true
          git checkout -b "$BRANCH_NAME"
          git commit -a -m "[skip ci] change version to new snapshot $CURRENT_PROJECT_VERSION"
          git push origin "$BRANCH_NAME"
          gh pr create -B main -H "$BRANCH_NAME" --title "Update Version to $CURRENT_PROJECT_VERSION" --body 'Created by "Do Release" workflow'
          echo "Please, accept the PR: Update Version to $CURRENT_PROJECT_VERSION"
